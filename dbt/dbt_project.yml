name: nyc311
version: "0.1.0"
config-version: 2
profile: nyc311

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  nyc311:
    +persist_docs: {relation: true, columns: true}
    staging:
      +schema: staging
      +materialized: incremental
    core:
      +schema: core
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

tests:
  nyc311:
    +store_failures: true
    +schema: dq
